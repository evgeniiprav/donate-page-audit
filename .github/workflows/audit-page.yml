name: Audit donate page

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Run audit
        run: python scripts/audit_page.py

      - name: Commit report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add reports/audit
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Аудит донатной страницы за $(date -u +%Y-%m-%d)"
            git push
          fi